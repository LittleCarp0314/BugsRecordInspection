<!DOCTYPE html>
<html>
<head>
    <title>缺陷记录规范检查</title> <!-- Changed extension title for browser tab -->
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="plugin-title">缺陷记录规范检查</div> <!-- Moved H1 to a div for top-left placement -->

        <div class="section">
            <h2>规范来源
                <span id="ragflowSettingsButton" class="settings-icon" title="RAGflow配置">⚙️</span>
            </h2>
            <div class="input-group">
                <label for="excelFileUpload">上传Excel文件:</label>
                <input type="file" id="excelFileUpload" accept=".xlsx, .xls">
            </div>
            <div class="input-group">
                <label for="directStandardsInput">直接编辑规范 (每行一条):</label>
                <textarea id="directStandardsInput" rows="4" placeholder="在此处直接输入或编辑缺陷记录规范，每行一条..."></textarea> <!-- Reduced rows for compactness -->
                <button id="applyDirectStandardsButton" class="small-button">应用编辑的规范</button>
            </div>
        </div>

        <div class="section">
            <h2>缺陷描述输入</h2>
            <div class="input-group">
                <button id="scanJiraButton">扫描当前Jira页面</button>
            </div>
            <div class="input-group">
                <!-- Increased rows for defect description, ensure it has enough space -->
                <textarea id="manualDefectInput" placeholder="在此处粘贴缺陷描述..." rows="6"></textarea>
            </div>
        </div>

        <div class="section-header-bar">
             <span>大模型</span>
             <span id="llmSettingsButton" class="settings-icon" title="大模型配置">⚙️</span>
        </div>

        <button id="startDetectionButton" class="primary-button">开始检查</button> <!-- Changed button text -->

        <div class="section">
            <h2>检测结果</h2>
            <div id="resultArea">
                <!-- Results will be displayed here -->
            </div>
        </div>
    </div>

    <!-- RAGflow Settings Modal (structure remains) -->
    <div id="ragflowSettingsModal" class="modal">
        <div class="modal-content">
            <span class="close-button" id="closeRagflowSettings">&times;</span>
            <h3>RAGflow 配置</h3>
            <div class="input-group">
                <label for="ragflowApiUrlInput">外部知识库API:</label>
                <input type="text" id="ragflowApiUrlInput" placeholder="例如: http://10.20.153.31/api/v1/dify">
            </div>
            <div class="input-group">
                <label for="ragflowKbIdInput">外部知识库ID:</label>
                <input type="text" id="ragflowKbIdInput" placeholder="输入知识库ID">
            </div>
            <button id="saveRagflowSettingsButton">保存RAGflow配置</button>
        </div>
    </div>

    <!-- LLM Settings Modal (structure remains) -->
    <div id="llmSettingsModal" class="modal">
        <div class="modal-content">
            <span class="close-button" id="closeLlmSettings">&times;</span>
            <h3>大模型配置</h3>
            <div class="input-group">
                <label for="llmType">选择模型类型:</label>
                <select id="llmType">
                    <option value="custom" selected>自定义</option>
                </select>
            </div>
            <div class="input-group">
                <label for="modelUrl">模型URL:</label>
                <input type="text" id="modelUrl" placeholder="模型URL">
            </div>
            <div class="input-group">
                <label for="apiKey">API Key:</label>
                <input type="password" id="apiKey" placeholder="API Key">
            </div>
            <button id="testConnectionButton">测试连接</button>
            <button id="saveLlmSettingsButton">保存大模型配置</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="popup.js"></script>
</body>
</html>
